name: Feature request or idea
description: Something Semaphore or the underlying idea could do that it doesn't yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Semaphore is a hackathon submission and is frozen from the Devpost deadline
        (2026-09-03) until judging ends (2026-09-21) — see
        [CONTRIBUTING.md](../../CONTRIBUTING.md). An idea filed here won't be acted on until the
        freeze lifts, but it's worth recording either way.
        [DESIGN.md](../../docs/DESIGN.md#15-whats-next) already lists the known next steps
        (ARCHIVE mode, a role-inversion chamber, wider benchmark coverage, applying the design
        principle elsewhere) — check there first.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd want to see, and why.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: How it fits the project's own design law
      description: >
        This project's central rule is that the asymmetry between what PILOT and KEEPER can
        perceive is never weakened for convenience. If your idea touches what either party can
        see or do, say how it respects that rather than working around it.
    validations:
      required: false
