<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace">
  <defs>
    <marker id="bh-tide" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8AA9E0"/>
    </marker>
    <marker id="bh-lamp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8B26A"/>
    </marker>
    <filter id="bglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="560" fill="#0B0F14"/>

  <text x="60" y="56" fill="#EDE7DC" font-size="19" font-weight="600" letter-spacing="4">THE ASYMMETRY</text>
  <text x="60" y="80" fill="#4C5A66" font-size="11" letter-spacing="1">PILOT perceives by sight. KEEPER perceives by touch. Neither reaches around the other.</text>

  <!-- Channel column -->
  <g font-size="12.5">
    <circle cx="130" cy="170" r="6" fill="#E8B26A"/>
    <text x="150" y="175" fill="#C9BFA6">VISUAL</text>

    <circle cx="130" cy="206" r="6" fill="#8AA9E0"/>
    <text x="150" y="211" fill="#C9BFA6">TACTILE</text>

    <circle cx="130" cy="242" r="6" fill="#EDE7DC"/>
    <text x="150" y="247" fill="#C9BFA6">AUDIBLE</text>
    <text x="150" y="264" fill="#4C5A66" font-size="10">both, rendered differently</text>

    <circle cx="130" cy="300" r="6" fill="#EDE7DC" opacity="0.6"/>
    <text x="150" y="305" fill="#8E9299">SHARED</text>

    <circle cx="130" cy="336" r="6" fill="none" stroke="#5E3B2C" stroke-width="1.5"/>
    <text x="150" y="341" fill="#5E3B2C">HIDDEN</text>
    <text x="150" y="358" fill="#4C5A66" font-size="10">reaches no one</text>
  </g>

  <!-- Two projections -->
  <rect x="420" y="120" width="270" height="110" rx="10" fill="#181410" stroke="#E8B26A" stroke-width="1.5"/>
  <text x="555" y="170" fill="#E8B26A" font-size="16" font-weight="600" text-anchor="middle">PILOT sees</text>
  <text x="555" y="195" fill="#8A7350" font-size="10.5" text-anchor="middle">the room, rendered</text>

  <rect x="420" y="330" width="270" height="110" rx="10" fill="#0F1620" stroke="#8AA9E0" stroke-width="1.5"/>
  <text x="555" y="380" fill="#8AA9E0" font-size="16" font-weight="600" text-anchor="middle">KEEPER calls</text>
  <text x="555" y="405" fill="#5C728F" font-size="10.5" text-anchor="middle">tools, and their answers</text>

  <path d="M310,188 C350,188 380,175 420,175" fill="none" stroke="#E8B26A" stroke-width="2" marker-end="url(#bh-lamp)"/>
  <path d="M310,282 C350,282 380,385 420,385" fill="none" stroke="#8AA9E0" stroke-width="2" marker-end="url(#bh-tide)"/>

  <!-- the proof -->
  <rect x="820" y="120" width="520" height="320" rx="10" fill="#141A22" stroke="#B8873C" stroke-width="1.75"/>
  <text x="1080" y="164" fill="#D9A24E" font-size="16" font-weight="600" text-anchor="middle">the possible-worlds proof</text>

  <circle cx="1080" cy="260" r="70" fill="none" stroke="#4C5A66" stroke-width="1.5" filter="url(#bglow)"/>
  <circle cx="1055" cy="248" r="7" fill="#B8873C"/>
  <circle cx="1100" cy="238" r="7" fill="#B8873C"/>
  <circle cx="1090" cy="280" r="7" fill="#B8873C"/>
  <circle cx="1050" cy="284" r="7" fill="#B8873C"/>
  <text x="1080" y="358" fill="#C9BFA6" font-size="12.5" text-anchor="middle">every world KEEPER's view allows</text>
  <text x="1080" y="382" fill="#C9BFA6" font-size="12.5" text-anchor="middle">disagrees on the right action</text>

  <text x="1080" y="428" fill="#D9A24E" font-size="14" font-weight="600" text-anchor="middle">log2(|W|) bits — the CONCORD reading</text>

  <text x="60" y="536" fill="#3A4551" font-size="10.5">tests/possible-worlds.test.ts · packages/asymmetry</text>
</svg>
