<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace">
  <defs>
    <marker id="ah-tide" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8AA9E0"/>
    </marker>
    <marker id="ah-lamp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8B26A"/>
    </marker>
    <marker id="ah-mist" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4C5A66"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#0B0F14"/>

  <text x="60" y="56" fill="#EDE7DC" font-size="19" font-weight="600" letter-spacing="4">SYSTEM</text>
  <text x="60" y="80" fill="#4C5A66" font-size="11" letter-spacing="2">projectForKeeper runs where the browser cannot reach it</text>

  <!-- Pipeline row, vertically centred -->
  <!-- AGENT -->
  <rect x="50" y="230" width="190" height="130" rx="10" fill="#141A22" stroke="#8AA9E0" stroke-width="1.5"/>
  <circle cx="145" cy="270" r="16" fill="none" stroke="#8AA9E0" stroke-width="2" filter="url(#glow)"/>
  <text x="145" y="322" fill="#8AA9E0" font-size="16" font-weight="600" text-anchor="middle">AGENT</text>
  <text x="145" y="342" fill="#5C6B78" font-size="10.5" text-anchor="middle">ChatGPT · Chrome</text>

  <!-- BROWSER -->
  <rect x="320" y="150" width="340" height="290" rx="10" fill="#141A22" stroke="#E8B26A" stroke-width="1.5"/>
  <text x="490" y="184" fill="#E8B26A" font-size="16" font-weight="600" text-anchor="middle">BROWSER</text>

  <rect x="350" y="210" width="280" height="70" rx="7" fill="#1F2831"/>
  <text x="490" y="240" fill="#EDE7DC" font-size="13.5" text-anchor="middle" font-weight="600">Three.js scene</text>
  <text x="490" y="260" fill="#5C6B78" font-size="10.5" text-anchor="middle">PILOT's view, and only PILOT's</text>

  <rect x="350" y="298" width="280" height="70" rx="7" fill="#1F2831"/>
  <text x="490" y="328" fill="#EDE7DC" font-size="13.5" text-anchor="middle" font-weight="600">WebMCP registry</text>
  <text x="490" y="348" fill="#5C6B78" font-size="10.5" text-anchor="middle">KEEPER's tools, live</text>

  <!-- Archive satellite -->
  <rect x="360" y="404" width="260" height="24" rx="12" fill="none" stroke="#8AA9E0" stroke-width="1.25" stroke-dasharray="3 4"/>
  <text x="490" y="420" fill="#7C93B8" font-size="10" text-anchor="middle">apps/archive — second origin</text>

  <!-- WORKER -->
  <rect x="750" y="230" width="220" height="130" rx="10" fill="#141A22" stroke="#4C5A66" stroke-width="1.5"/>
  <text x="860" y="290" fill="#EDE7DC" font-size="16" font-weight="600" text-anchor="middle">WORKER</text>
  <text x="860" y="312" fill="#5C6B78" font-size="10.5" text-anchor="middle">Cloudflare, edge routed</text>

  <!-- DURABLE OBJECT -->
  <rect x="1050" y="130" width="290" height="360" rx="10" fill="#1A140E" stroke="#B8873C" stroke-width="1.75"/>
  <text x="1195" y="170" fill="#D9A24E" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="1">DURABLE OBJECT</text>
  <text x="1195" y="192" fill="#8A6B3E" font-size="10.5" text-anchor="middle">the only place truth lives</text>

  <line x1="1080" y1="216" x2="1310" y2="216" stroke="#3A2E1A" stroke-width="1"/>

  <g font-size="12.5" fill="#C9BFA6">
    <text x="1080" y="248">channel-tagged state</text>
    <text x="1080" y="278">action semaphore · n = 1</text>
    <text x="1080" y="308">server timer</text>
    <text x="1080" y="338">consistentWorlds → CONCORD</text>
    <text x="1080" y="368">perception model · Blackout</text>
  </g>

  <line x1="1080" y1="392" x2="1310" y2="392" stroke="#3A2E1A" stroke-width="1"/>
  <text x="1080" y="424" fill="#D9A24E" font-size="12.5" font-weight="600">event log</text>
  <text x="1080" y="446" fill="#8A6B3E" font-size="10.5">replay · benchmark · ghosts</text>

  <!-- D1 -->
  <rect x="1110" y="530" width="170" height="70" rx="10" fill="#141A22" stroke="#4C5A66" stroke-width="1.5"/>
  <text x="1195" y="560" fill="#EDE7DC" font-size="13.5" font-weight="600" text-anchor="middle">D1</text>
  <text x="1195" y="580" fill="#5C6B78" font-size="10" text-anchor="middle">finished sessions</text>

  <!-- Flow arrows -->
  <path d="M240,285 C270,285 290,285 320,285" fill="none" stroke="#8AA9E0" stroke-width="2" marker-end="url(#ah-tide)"/>
  <text x="280" y="272" fill="#5C6B78" font-size="10" text-anchor="middle">execute()</text>

  <path d="M660,285 C700,285 715,295 750,295" fill="none" stroke="#4C5A66" stroke-width="1.75" marker-end="url(#ah-mist)"/>

  <path d="M970,285 C1005,285 1015,285 1050,285" fill="none" stroke="#B8873C" stroke-width="2" marker-end="url(#ah-lamp)"/>

  <path d="M1195,490 L1195,530" fill="none" stroke="#4C5A66" stroke-width="1.75" marker-end="url(#ah-mist)"/>

  <!-- push back, arcing above everything, clear of every box -->
  <path d="M1050,180 C900,90 560,90 500,150" fill="none" stroke="#4C5A66" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#ah-mist)"/>
  <text x="770" y="86" fill="#5C6B78" font-size="10" text-anchor="middle">state pushed over one socket</text>

  <text x="60" y="596" fill="#3A4551" font-size="10.5">Full detail — ARCHITECTURE.md</text>
</svg>
