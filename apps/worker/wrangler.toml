name = "semaphore"
main = "src/index.ts"
compatibility_date = "2026-08-27"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "Session"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session"]

# One JSONL object per session — replay viewer and benchmark corpus (doc 04 §9).
[[r2_buckets]]
binding = "LOGS"
bucket_name = "semaphore-session-logs"
